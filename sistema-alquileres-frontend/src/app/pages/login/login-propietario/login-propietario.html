<div class="body-propietario">

    <div class="login-card">
        <a routerLink="" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="text-center">
            <div class="login-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="h3 fw-normal mb-1">Sistema de Alquileres</h2>
            <p class="text-muted mb-4">Inicia sesión para continuar</p>
        </div>

        <form (ngSubmit)="login()">
            <div class="mb-3">
                <input type="email" [(ngModel)]="correo" name="correo" class="form-control" placeholder="Correo electrónico *" required>
            </div>
            <div class="mb-4">
                <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Contraseña *" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">INICIAR SESIÓN</button>
            <!-- <div class="text-center mt-4">
                <p class="text-muted mb-2">
                    ¿Aún no tienes acceso?
                </p>
                <a routerLink="/registro/propietario" class="registro-link">
                    Enviar solicitud de registro
                </a>
            </div> -->
        </form>        
    </div>
</div>
