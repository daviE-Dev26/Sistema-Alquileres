<div class="body-inquilino">
  <div class="login-card text-center">
    <a routerLink="" class="back-button">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    
    <div class="login-icon">
      <i class="fa-solid fa-key"></i>
    </div>

    <h2 class="fw-normal mb-1" style="font-size: 2.2rem;">Portal del Inquilino</h2>
    <p class="text-muted mb-5">Ingresa tu código de acceso</p>
    
    <form (ngSubmit)="acceder()">
      <div class="form-group-custom text-start">
        <span class="label-custom">Código de Inquilino *</span>
        <input 
          type="text" 
          [(ngModel)]="codigoAcceso" 
          name="codigoAcceso" 
          class="form-control form-control-custom" 
          placeholder="Código de acceso" 
          required>
        
        <div *ngIf="errorMessage" class="text-danger small mt-2 d-flex align-items-center gap-1">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-acceder">ACCEDER</button>
    </form>
  </div>
</div>
