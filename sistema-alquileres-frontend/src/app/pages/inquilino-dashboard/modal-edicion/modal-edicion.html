<div class="modal-backdrop-custom">
    <div class="modal-card-custom">

        <div class="modal-header-custom">
            <div>
                <h5 class="mb-1">
                    <i class="fa-solid fa-user-pen me-2"></i>
                    Editar datos de contacto
                </h5>
                <small class="text-muted">
                    Actualiza tu correo y número de contacto
                </small>
            </div>

            <button type="button" class="btn-close" (click)="cerrarModal()"></button>
        </div>

        <div class="modal-body-custom">

            <div class="mb-3">
                <label class="form-label fw-semibold">Celular</label>
                <input type="text" class="form-control" [(ngModel)]="celular" maxlength="9" placeholder="Ej: 987654321">
                <small class="text-muted">Debe iniciar con 9 y tener 9 dígitos.</small>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" class="form-control" [(ngModel)]="correo" placeholder="Ej: usuario@gmail.com">
                <small class="text-muted">Usaremos este correo para avisos y recordatorios.</small>
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-0">
                <i class="fa-solid fa-circle-exclamation me-1"></i>
                {{ errorMessage }}
            </div>

        </div>

        <div class="modal-footer-custom">
            <button class="btn btn-secondary" type="button" (click)="cerrarModal()">
                Cancelar
            </button>

            <button class="btn btn-primary" type="button" [disabled]="guardando" (click)="guardarCambios()">
                <span *ngIf="!guardando">
                    <i class="fa-solid fa-floppy-disk me-1"></i>
                    Guardar cambios
                </span>

                <span *ngIf="guardando">
                    Guardando...
                </span>
            </button>
        </div>

    </div>
</div>
