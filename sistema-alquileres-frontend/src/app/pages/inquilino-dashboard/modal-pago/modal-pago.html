<div class="overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3>
                <i class="fa-solid fa-credit-card"></i>
                Pago de alquiler
            </h3>
            <button class="btn-close-custom" (click)="cancelar()">
                ×
            </button>
        </div>

        <div class="modal-body">
            <div class="info">
                <label>Precio mensual</label>
                <span>S/. {{precioMensual}}</span>
            </div>

            <div class="info">
                <label>Meses pendientes</label>
                <span>{{mesesPendientes}}</span>
            </div>

            <label>Cantidad de meses</label>
            <div class="contador">
                <button (click)="disminuirMes()">-</button>
                <span>{{cantidadMeses}}</span>
                <button (click)="aumentarMes()">+</button>
            </div>

            <label>Método de pago</label>
            <!-- ✅ SECCIÓN MODIFICADA: Solo Tarjeta, Yape y Plin -->
            <select [(ngModel)]="metodoPago">
                <option value="CULQI">Tarjeta (Culqi)</option>
                <option value="YAPE">Yape</option>
                <option value="PLIN">Plin</option>
            </select>

            <label>Observación</label>
            <textarea [(ngModel)]="observacion"></textarea>

            <div class="total">
                Total
                <span>S/. {{total}}</span>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancelar" (click)="cancelar()">
                Cancelar
            </button>
            <button class="btn-pagar" (click)="pagar()">
                Pagar
            </button>
        </div>
    </div>
</div>
