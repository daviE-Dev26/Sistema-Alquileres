spring.application.name=SistemaAlquiler

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sistemaAlquileres;encrypt=true;trustServerCertificate=true
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.mailersend.net
spring.mail.port=587
spring.mail.username=TU_USUARIO_DE_CORREO
spring.mail.password=TU_PASSWORD_DE_CORREO
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

culqi.public.key=TU_CLAVE_PUBLICA
culqi.secret.key=TU_CLAVE_SECRETA